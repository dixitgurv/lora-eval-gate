# LoRA fine-tune of a small instruct model for text-to-SQL.
base_model: Qwen/Qwen2.5-0.5B-Instruct
train_path: data/train.jsonl
train_examples: 2000
output_dir: adapters/sql-lora
seed: 42

# LoRA: rank-16 adapters on every attention and MLP projection.
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Optimisation: effective batch 16, one epoch, cosine decay.
batch_size: 2
grad_accum: 8
learning_rate: 2.0e-4
epochs: 1
warmup_steps: 20
max_len: 256
